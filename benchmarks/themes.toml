# The themes a calibration review reads a campaign by; what a theme is and who owns what: README.md#themes.

[[themes]]
name = "Nations' internal fortunes"
description = """
How each nation fares within its own borders: its economy, population, education, inequality, cohesion and unrest,
its government and leadership, its armed forces and nuclear arsenal, its standing among nations, and the regions
that break away or win independence from it.
"""
event_types = [
  "nation.band_crossed",
  "nation.breakaway",
  "nation.breakaway_parent_changed",
  "nation.breakaways_changed",
  "nation.capital_changed",
  "nation.cohesion_shift",
  "nation.demobilization",
  "nation.economic_trajectory",
  "nation.education_shift",
  "nation.government_shift",
  "nation.independence",
  "nation.inequality_shift",
  "nation.military_buildup",
  "nation.miltech_shift",
  "nation.navy_established",
  "nation.new_government_recorded",
  "nation.nuclear_armament",
  "nation.nuclear_buildup",
  "nation.nuclear_disarmament",
  "nation.nuclear_program_changed",
  "nation.pcgdp_trend",
  "nation.policy_changed",
  "nation.population_changed",
  "nation.population_collapse",
  "nation.rank_changed",
  "nation.release",
  "nation.renamed",
  "nation.statistic_shifted",
  "nation.unrest_attempts_changed",
  "nation.unrest_shift",
  "world.ranking_changed",
]

[[themes]]
name = "Control of nations"
description = """
Who holds power over each nation's government: the factions gaining and losing control points and executives, and
the takeovers that hand whole nations to a faction, whatever front or proxy the faction acts through.
"""
event_types = [
  "control_point.controller_changed",
  "control_point.loss_recorded",
  "faction.control_points_changed",
  "faction.nation_control_changed",
  "faction.takeover",
  "faction.takeover_wave",
  "nation.control_points_changed",
  "nation.executive_change_recorded",
  "nation.unrest_attempts_changed",
]

[[themes]]
name = "Blocs and unions"
description = """
Nations drawing together or apart: alliances and rivalries, diplomatic realignments, federations forming, growing,
shrinking and dissolving, and nations unifying, merging or annexing one another into larger states.
"""
