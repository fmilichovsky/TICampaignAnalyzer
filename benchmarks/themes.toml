[[themes]]
name = "Public opinion and ideology"
description = """
What the people of each nation believe about the alien question: the shares of public opinion each ideology holds
and the undecided, how they shift, and the public's discontent and its say in government.
"""
event_types = [
  "nation.band_crossed",
  "nation.government_shift",
  "nation.statistic_shifted",
  "nation.unrest_shift",
]

[[themes]]
name = "Alien activity on Earth"
description = """
The aliens' presence on Earth itself: crashdowns, landings, alien facilities built in regions and the xenoforming
that spreads from them.
"""
event_types = [
  "region.alien_facility_changed",
  "region.crashdown_changed",
  "region.landing_changed",
  "region.xenoforming_changed",
]

[[themes]]
name = "Expansion into space"
description = """
Humanity and the aliens moving off Earth: national space programs and assets, the first habs on each body,
stations and bases founded, upgraded and completed, waves of colonisation, and the fleets built to hold them.
"""
event_types = [
  "campaign.first_milestone",
  "campaign.global_milestone_recorded",
  "faction.colonisation_wave",
  "faction.first_hab_on_body",
  "faction.fleet_buildup",
  "hab.appeared",
  "hab.core_completed_changed",
  "hab.disappeared",
  "hab.established",
  "hab.tier_changed",
  "hab.type_changed",
  "nation.space_assets_changed",
  "nation.space_defences_established",
  "nation.space_program_growth",
]

[[themes]]
name = "Conflict in space"
description = """
Fighting beyond Earth: fleet battles, habs assaulted, bombarded, captured and destroyed, the losses each faction
takes, the campaigns those fights add up to, and the fleets and defences built for them.
"""
event_types = [
  "faction.combat_recorded",
  "faction.fleet_buildup",
  "faction.hab_destruction_recorded",
  "faction.space_campaign",
  "faction.space_losses",
  "fleet.in_combat_changed",
  "hab.destroyed",
  "hab.disappeared",
  "hab.faction_changed",
  "hab.in_combat_changed",
  "hab.under_assault_changed",
  "hab.under_bombardment_changed",
  "nation.space_defences_established",
]

[[themes]]
name = "Technology and firsts"
description = """
What the factions learn and achieve: technologies researched, projects completed, the milestone discoveries among
them, and the global firsts the game records for whoever reaches them.
"""
event_types = [
  "campaign.first_milestone",
  "campaign.global_milestone_recorded",
  "faction.finished_project_names_changed",
  "faction.project_completed",
  "research.finished_techs_changed",
  "technology.completed",
  "technology.finished_changed",
  "technology.milestone",
]

