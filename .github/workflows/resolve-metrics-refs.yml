name: Resolve metrics refs

on:
  workflow_call:
    outputs:
      base_sha:
        description: Commit SHA for the base revision
        value: ${{ jobs.resolve.outputs.base_sha }}
      base_ref:
        description: Ref name for the base revision
        value: ${{ jobs.resolve.outputs.base_ref }}
      head_sha:
        description: Commit SHA for the head revision
        value: ${{ jobs.resolve.outputs.head_sha }}
      head_checkout_ref:
        description: Ref to use when checking out the head source
        value: ${{ jobs.resolve.outputs.head_checkout_ref }}
      head_ref:
        description: Ref name for the head revision
        value: ${{ jobs.resolve.outputs.head_ref }}
      pr_number:
        description: Matching pull request number, if one exists
        value: ${{ jobs.resolve.outputs.pr_number }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.refs.outputs.base_sha }}
      base_ref: ${{ steps.refs.outputs.base_ref }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
      head_checkout_ref: ${{ steps.refs.outputs.head_checkout_ref }}
      head_ref: ${{ steps.refs.outputs.head_ref }}
      pr_number: ${{ steps.refs.outputs.pr_number }}
    steps:
      - id: refs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const eventName = context.eventName;
            let baseSha;
            let baseRef;
            let headSha;
            let headRef;
            let headCheckoutRef;
            let prNumber = '';

            if (eventName === 'issue_comment') {
              const number = context.payload.issue.number;
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              baseSha = pull.base.sha;
              baseRef = pull.base.ref;
              headSha = pull.head.sha;
              headRef = pull.head.ref;
              headCheckoutRef = `refs/pull/${number}/head`;
              prNumber = String(number);
            } else {
              const defaultBranch = context.payload.repository.default_branch;
              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: defaultBranch });
              baseSha = branch.commit.sha;
              baseRef = defaultBranch;
              headSha = context.sha;
              headRef = context.ref.replace(/^refs\/(heads|tags)\//, '');
              headCheckoutRef = headSha;

              const matches = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${headRef}`,
              });
              if (matches.length === 1) {
                prNumber = String(matches[0].number);
              }
            }

            core.setOutput('base_sha', baseSha);
            core.setOutput('base_ref', baseRef);
            core.setOutput('head_sha', headSha);
            core.setOutput('head_ref', headRef);
            core.setOutput('head_checkout_ref', headCheckoutRef);
            core.setOutput('pr_number', prNumber);
