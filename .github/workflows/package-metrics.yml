name: Package metrics

# Measures the narrator packages and narrate plans of the benchmark samples on the pull request's base and on its
# head, and posts the difference as one comment that every later push edits. Informational: size changes never fail
# the check. See benchmarks/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: package-metrics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure-base:
    runs-on: ubuntu-latest
    steps:
      # The head checkout supplies the CLI, samples, matrix and settings that both sides are measured with.
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bench/base-src
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install metrics CLI
        run: python -m pip install --quiet .
      - name: Install base
        run: |
          python -m venv .bench/venv-base
          .bench/venv-base/bin/python -m pip install --quiet ./.bench/base-src
      - name: Measure base
        run: >-
          python -m tinarrative.cli benchmark metrics measure --python .bench/venv-base/bin/python
          --samples benchmarks/samples --matrix benchmarks/matrix.toml --config benchmarks/config.toml --out .bench/base
          --label "${{ github.event.pull_request.base.ref }} ${GITHUB_BASE_SHA::7}"
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: metrics-base
          path: .bench/base
          retention-days: 1

  measure-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install metrics CLI
        run: python -m pip install --quiet .
      - name: Install head
        run: |
          python -m venv .bench/venv-head
          .bench/venv-head/bin/python -m pip install --quiet .
      - name: Measure head
        run: >-
          python -m tinarrative.cli benchmark metrics measure --python .bench/venv-head/bin/python
          --samples benchmarks/samples --matrix benchmarks/matrix.toml --config benchmarks/config.toml --out .bench/head
          --label "#${{ github.event.pull_request.number }} ${GITHUB_HEAD_SHA::7}"
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: metrics-head
          path: .bench/head
          retention-days: 1

  compare:
    needs: [measure-base, measure-head]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install metrics CLI
        run: python -m pip install --quiet .
      - uses: actions/download-artifact@v8
        with:
          name: metrics-base
          path: .bench/base
      - uses: actions/download-artifact@v8
        with:
          name: metrics-head
          path: .bench/head
      - name: Compare
        run: |
          python -m tinarrative.cli benchmark metrics compare .bench/base/metrics.json .bench/head/metrics.json \
            --out .bench/report.md --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat .bench/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: package-metrics
          path: |
            .bench/report.md
            .bench/base
            .bench/head
          retention-days: 14
      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- package-metrics -->")))][0].id // empty' \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@.bench/report.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@.bench/report.md > /dev/null
          fi
