name: Package metrics

# Measures narrator packages and plans on demand. Informational: size changes never fail the check.
# See benchmarks/README.md.

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: package-metrics-${{ (github.event_name == 'issue_comment' && github.event.comment.body == '/benchmarks' && github.event.issue.pull_request && github.event.issue.number) || (github.event_name == 'workflow_dispatch' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/benchmarks')
    permissions:
      contents: read
      pull-requests: read
      issues: none
    uses: ./.github/workflows/resolve-metrics-refs.yml

  measure-base:
    needs: resolve
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # The head checkout supplies the CLI, samples, matrix and settings that both sides are measured with.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: .bench/base-src
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install metrics CLI
        run: python -m pip install --quiet .
      - name: Install base
        run: |
          python -m venv .bench/venv-base
          .bench/venv-base/bin/python -m pip install --quiet ./.bench/base-src
      - name: Measure base
        run: >-
          python -m tinarrative.cli benchmark metrics measure --python .bench/venv-base/bin/python
          --samples benchmarks/samples --matrix benchmarks/matrix.toml --config benchmarks/config.toml --out .bench/base
          --label "$BASE_LABEL ${GITHUB_BASE_SHA::7}"
        env:
          GITHUB_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          BASE_LABEL: ${{ needs.resolve.outputs.base_ref }}
      - uses: actions/upload-artifact@v7
        with:
          name: metrics-base
          path: .bench/base
          retention-days: 1

  measure-head:
    needs: resolve
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install metrics CLI
        run: python -m pip install --quiet .
      - name: Install head
        run: |
          python -m venv .bench/venv-head
          .bench/venv-head/bin/python -m pip install --quiet .
      - name: Measure head
        run: >-
          python -m tinarrative.cli benchmark metrics measure --python .bench/venv-head/bin/python
          --samples benchmarks/samples --matrix benchmarks/matrix.toml --config benchmarks/config.toml --out .bench/head
          --label "$HEAD_LABEL ${GITHUB_HEAD_SHA::7}"
        env:
          GITHUB_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HEAD_LABEL: ${{ needs.resolve.outputs.head_ref }}
      - uses: actions/upload-artifact@v7
        with:
          name: metrics-head
          path: .bench/head
          retention-days: 1

  compare:
    needs: [resolve, measure-base, measure-head]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install metrics CLI
        run: python -m pip install --quiet .
      - uses: actions/download-artifact@v8
        with:
          name: metrics-base
          path: .bench/base
      - uses: actions/download-artifact@v8
        with:
          name: metrics-head
          path: .bench/head
      - name: Compare
        run: |
          python -m tinarrative.cli benchmark metrics compare .bench/base/metrics.json .bench/head/metrics.json \
            --out .bench/report.md --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat .bench/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: package-metrics
          path: |
            .bench/report.md
            .bench/base
            .bench/head
          retention-days: 14
  post-comment:
    needs: [resolve, compare]
    if: needs.resolve.outputs.pr_number != ''
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/post-metrics-comment.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      artifact_name: package-metrics
      report_path: report.md
      comment_marker: '<!-- package-metrics -->'
