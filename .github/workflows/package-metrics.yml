name: Package metrics

# Measures narrator packages and plans on demand. Informational: size changes never fail the check.
# See benchmarks/README.md.

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: package-metrics-${{ (github.event_name == 'issue_comment' && github.event.comment.body == '/benchmarks' && github.event.issue.pull_request && github.event.issue.number) || (github.event_name == 'workflow_dispatch' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/benchmarks')
    permissions:
      contents: read
      pull-requests: read
      issues: none
    uses: ./.github/workflows/resolve-metrics-refs.yml

  placeholder-comment:
    needs: resolve
    if: needs.resolve.outputs.pr_number != ''
    permissions:
      actions: read
      pull-requests: write
    uses: ./.github/workflows/post-metrics-comment.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      benchmark_name: 'Package metrics'
      artifact_name: package-metrics
      report_path: report.md
      comment_marker: '<!-- package-metrics -->'
      status: in_progress
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}

  samples:
    needs: resolve
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - id: matrix
        name: Read sample campaigns
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("benchmarks/samples/samples.json").read_text(encoding="utf-8"))
          print("value=" + json.dumps({"sample": list(manifest["campaigns"]), "side": ["base", "head"]}, separators=(",", ":")))
          PY

  measure:
    name: measure (${{ matrix.sample }}, ${{ matrix.side }})
    needs: [resolve, samples]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.samples.outputs.matrix) }}
    steps:
      # The head checkout supplies the CLI, samples, matrix and settings that both sides are measured with.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - uses: actions/checkout@v7
        if: matrix.side == 'base'
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: .bench/base-src
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install metrics CLI
        run: python -m pip install --quiet .
      - name: Install base
        if: matrix.side == 'base'
        run: |
          python -m venv .bench/venv
          .bench/venv/bin/python -m pip install --quiet ./.bench/base-src
      - name: Install head
        if: matrix.side == 'head'
        run: |
          python -m venv .bench/venv
          .bench/venv/bin/python -m pip install --quiet .
      - name: Measure
        run: >-
          python -m tinarrative.cli benchmark metrics measure --python .bench/venv/bin/python
          --campaign "$SAMPLE" --samples benchmarks/samples --matrix benchmarks/matrix.toml
          --config benchmarks/config.toml --out .bench/out --label "$LABEL ${REVISION::7}"
        env:
          SAMPLE: ${{ matrix.sample }}
          LABEL: ${{ matrix.side == 'base' && needs.resolve.outputs.base_ref || needs.resolve.outputs.head_ref }}
          REVISION: ${{ matrix.side == 'base' && needs.resolve.outputs.base_sha || needs.resolve.outputs.head_sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: metrics-${{ matrix.side }}-${{ matrix.sample }}
          path: .bench/out
          retention-days: 1

  compare:
    needs: [resolve, measure]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install metrics CLI
        run: python -m pip install --quiet .
      - uses: actions/download-artifact@v8
        with:
          pattern: metrics-*
          path: .bench/parts
      - name: Merge campaigns
        run: |
          for side in base head; do
            mkdir -p ".bench/$side"
            python -m tinarrative.cli benchmark metrics merge .bench/parts/metrics-$side-*/metrics.json \
              --out ".bench/$side/metrics.json"
            for part in .bench/parts/metrics-$side-*; do
              for kept in packages narrate; do
                if [ -d "$part/$kept" ]; then
                  mkdir -p ".bench/$side/$kept"
                  cp -R "$part/$kept/." ".bench/$side/$kept/"
                fi
              done
            done
          done
      - name: Compare
        run: |
          python -m tinarrative.cli benchmark metrics compare .bench/base/metrics.json .bench/head/metrics.json \
            --out .bench/report.md --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat .bench/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: package-metrics
          path: |
            .bench/report.md
            .bench/base
            .bench/head
          retention-days: 14
  post-comment:
    needs: [resolve, compare, placeholder-comment]
    if: needs.resolve.outputs.pr_number != ''
    permissions:
      actions: read
      pull-requests: write
    uses: ./.github/workflows/post-metrics-comment.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      benchmark_name: 'Package metrics'
      artifact_name: package-metrics
      report_path: report.md
      comment_marker: '<!-- package-metrics -->'

  failure-comment:
    needs: [resolve, placeholder-comment, samples, measure, compare]
    if: always() && !cancelled() && needs.resolve.outputs.pr_number != '' && (needs.samples.result == 'failure' || needs.measure.result == 'failure' || needs.compare.result == 'failure')
    permissions:
      actions: read
      pull-requests: write
    uses: ./.github/workflows/post-metrics-comment.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      benchmark_name: 'Package metrics'
      artifact_name: package-metrics
      report_path: report.md
      comment_marker: '<!-- package-metrics -->'
      status: failed
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
