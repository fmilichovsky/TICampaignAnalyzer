name: Package metrics experiment

# Temporary (#331): measures base and head in concurrent or sequential mode and prints wall time and peak RSS.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: concurrent or sequential
        required: true
        default: concurrent
        type: choice
        options: [concurrent, sequential]

permissions:
  contents: read

jobs:
  resolve:
    permissions:
      contents: read
      pull-requests: read
      issues: none
    uses: ./.github/workflows/resolve-metrics-refs.yml

  measure:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - uses: actions/checkout@v7
        if: matrix.side == 'base'
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: .bench/src
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install metrics CLI
        run: python -m pip install --quiet .
      - name: Install measured revision
        run: |
          python -m venv .bench/venv
          if [ "${{ matrix.side }}" = base ]; then src=./.bench/src; else src=.; fi
          .bench/venv/bin/python -m pip install --quiet "$src"
      - name: Measure
        run: |
          flag=""
          if [ "${{ inputs.mode }}" = sequential ]; then flag="--sequential"; fi
          echo "cpus: $(nproc), mem: $(free -m | awk '/Mem:/ {print $2}') MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/peak_rss_tree.py -- python -m tinarrative.cli benchmark metrics measure \
            --python .bench/venv/bin/python --samples benchmarks/samples --matrix benchmarks/matrix.toml \
            --config benchmarks/config.toml --out .bench/out --label "${{ matrix.side }}" $flag 2> .bench/log.txt || status=$?
          cat .bench/log.txt
          { echo "### ${{ inputs.mode }} / ${{ matrix.side }}"; echo '```'; grep -E "package_metrics: (done|[a-z-]+ ·)|peak_rss_tree" .bench/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
