name: Post metrics comment

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number for the report comment
        required: true
        type: string
      artifact_name:
        description: Artifact containing the report
        required: true
        type: string
      report_path:
        description: Report filename within the downloaded artifact
        required: true
        type: string
      comment_marker:
        description: HTML marker identifying the existing bot comment
        required: true
        type: string

jobs:
  post-comment:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: .bench
      - name: Post comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REPORT_FILE: .bench/${{ inputs.report_path }}
          COMMENT_MARKER: ${{ inputs.comment_marker }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const body = fs.readFileSync(process.env.REPORT_FILE, 'utf8');
            const marker = process.env.COMMENT_MARKER;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            }
