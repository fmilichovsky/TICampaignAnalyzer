name: Runtime metrics

# Times `events` on demand, alternating base and head on each runner. Timings from different runners are not
# comparable. Informational: a slower stage never fails the check. See benchmarks/README.md.

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: runtime-metrics-${{ (github.event_name == 'issue_comment' && github.event.comment.body == '/benchmarks' && github.event.issue.pull_request && github.event.issue.number) || (github.event_name == 'workflow_dispatch' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/benchmarks')
    permissions:
      contents: read
      pull-requests: read
      issues: none
    uses: ./.github/workflows/resolve-metrics-refs.yml

  samples:
    needs: resolve
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - id: matrix
        name: Read sample campaigns
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("benchmarks/samples/samples.json").read_text(encoding="utf-8"))
          print("value=" + json.dumps({"sample": list(manifest["campaigns"])}, separators=(",", ":")))
          PY

  measure:
    needs: [resolve, samples]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.samples.outputs.matrix) }}
    steps:
      # The head checkout supplies the CLI, sample, matrix and settings used to measure both revisions.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: .bench/base-src
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install runtime CLI
        run: python -m pip install --quiet .
      - name: Install base and head
        run: |
          python -m venv .bench/venv-base
          .bench/venv-base/bin/python -m pip install --quiet ./.bench/base-src
          python -m venv .bench/venv-head
          .bench/venv-head/bin/python -m pip install --quiet .
      - name: Prepare sample
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          mkdir -p ".bench/sample/$SAMPLE"
          for file in "benchmarks/samples/$SAMPLE"/*.json.xz; do
            xz -dc "$file" > ".bench/sample/$SAMPLE/$(basename "$file" .xz)"
          done
      - name: Measure
        run: >-
          python -m tinarrative.cli benchmark runtime measure --repeats 3
          --base-python .bench/venv-base/bin/python --base-label "$BASE_LABEL ${GITHUB_BASE_SHA::7}"
          --python .bench/venv-head/bin/python --label "$HEAD_LABEL ${GITHUB_HEAD_SHA::7}"
          --samples ".bench/sample/${{ matrix.sample }}" --matrix benchmarks/matrix.toml --config benchmarks/config.toml
          --out .bench/runtime.json
        env:
          GITHUB_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          GITHUB_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE_LABEL: ${{ needs.resolve.outputs.base_ref }}
          HEAD_LABEL: ${{ needs.resolve.outputs.head_ref }}
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.sample }}
          path: .bench/runtime.json
          retention-days: 1

  report:
    needs: [resolve, measure]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head_checkout_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install runtime CLI
        run: python -m pip install --quiet .
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: .bench/results
      - name: Combine measurements
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          result_paths = sorted(Path(".bench/results").glob("*/runtime.json"))
          if not result_paths:
              raise SystemExit("No per-sample runtime measurements were downloaded")

          results = [json.loads(path.read_text(encoding="utf-8")) for path in result_paths]
          combined = dict(results[0])
          for key in ("tool_version", "run", "args", "repeats", "samples_sha256"):
              if any(result[key] != combined[key] for result in results[1:]):
                  raise SystemExit(f"Per-sample runtime metadata differs for {key}")

          combined["sides"] = {
              side: {
                  "label": results[0]["sides"][side]["label"],
                  "campaigns": {
                      campaign: campaign_result
                      for result in results
                      for campaign, campaign_result in result["sides"][side]["campaigns"].items()
                  },
              }
              for side in results[0]["sides"]
          }
          campaigns = [campaign for result in results for campaign in result["sides"]["head"]["campaigns"]]
          if len(campaigns) != len(set(campaigns)):
              raise SystemExit("A campaign appears in more than one runtime measurement")
          combined["samples_sha256"] = hashlib.sha256(
              Path("benchmarks/samples/samples.json").read_bytes()
          ).hexdigest()

          output = Path(".bench/runtime.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(combined, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Report
        run: |
          python -m tinarrative.cli benchmark runtime report .bench/runtime.json --out .bench/runtime.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat .bench/runtime.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-metrics
          path: |
            .bench/runtime.json
            .bench/runtime.md
          retention-days: 14
  post-comment:
    needs: [resolve, report]
    if: needs.resolve.outputs.pr_number != ''
    permissions:
      actions: read
      pull-requests: write
    uses: ./.github/workflows/post-metrics-comment.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      artifact_name: runtime-metrics
      report_path: runtime.md
      comment_marker: '<!-- runtime-metrics -->'
