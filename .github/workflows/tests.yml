name: Quality gate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make install
      - run: make check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make install
      - run: make docs
      - name: Fail if generated docs are stale
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  browser-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: make install
      - run: make browser-replay-check

  samples:
    runs-on: ubuntu-latest
    env:
      SAMPLE_CAMPAIGNS: resist-long,protectorate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: make install
      - run: make samples
      - run: make browser-replay-samples
