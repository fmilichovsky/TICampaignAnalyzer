name: Quality gate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make install
      - run: make check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make install
      - run: make docs
      - name: Fail if generated docs are stale
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Pull requests run the short campaign only; pushes to main run every campaign.
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make install
      - name: Sample tests (pull request, short campaign)
        if: github.event_name == 'pull_request'
        run: make samples-fast
      - name: Sample tests (main, every campaign)
        if: github.event_name != 'pull_request'
        run: make samples
