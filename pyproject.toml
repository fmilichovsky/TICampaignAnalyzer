[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "tinarrative"
version = "0.1.0"
description = "Reconstruct readable Terra Invicta campaign history from save files."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Filip Milichovsky" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
tinarrative = "tinarrative.cli:main"

[project.optional-dependencies]
test = ["pytest==9.2.0"]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not real_save", "-p", "no:cacheprovider"]
markers = [
  "fixture: test reads a checked-in fixture",
  "real_save: test uses a sanitized real Terra Invicta save; excluded from the default suite",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinarrative"]
