[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tinarrative"
version = "0.1.0"
description = "Reconstruct readable Terra Invicta campaign history from save files."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Filip Milichovsky" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
tinarrative = "tinarrative.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not real_save", "-p", "no:cacheprovider"]
markers = [
  "fixture: test reads a checked-in fixture",
  "real_save: test uses a sanitized real Terra Invicta save; excluded from the default suite",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinarrative"]
