<!doctype html>
<!-- PROTOTYPE, throwaway (wayfinder #452). Three variants of the stake calibration dashboard on real benchmark
     data, switchable via ?variant=A|B|C and the floating bar (← → keys). Open from disk; data.js from extract.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stake calibration</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --ink: #1f2328; --mute: #6a717b; --line: #e2e3e0; --soft: #f0f0ec;
  --drop: #4f86c6; --keep: #b9bcc2; --rise: #e08a3c; --win: rgba(120, 150, 200, .12);
  --l0: #d7d9dd; --l1: #9cc0e4; --l2: #3f74bb; --l3: #1b2c57; --up: #c2571a; --down: #2c6fb3; --warn: #fff3cd;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
h1 { font-size: 16px; margin: 0; font-weight: 600; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); margin: 18px 0 8px; font-weight: 600; }
h3 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
.mono, code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.mute { color: var(--mute); }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: #b8bcc2; }
button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.banner { background: var(--warn); border-bottom: 1px solid #e8d48b; padding: 8px 18px; font-size: 13px; }
header.top { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header.top .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; background: var(--panel); cursor: pointer; user-select: none; }
.chip.off { opacity: .45; text-decoration: line-through; }
.toggle { font-size: 12px; color: var(--mute); }
details.toggle summary { cursor: pointer; }
.refrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.refrow input[type=range] { flex: 1; min-width: 200px; }
.refrow input[type=number] { width: 110px; font: inherit; padding: 2px 4px; }
svg text { font-size: 10px; fill: var(--mute); }
.bar.low { fill: var(--drop); } .bar.in { fill: var(--keep); } .bar.high { fill: var(--rise); }
.bar.draft { fill: none; stroke: #7b5ea7; stroke-dasharray: 2 1; }
.win { fill: var(--win); } .refline { stroke: var(--ink); stroke-width: 1.5; } .codeline { stroke: var(--mute); stroke-dasharray: 3 3; }
.cutline { stroke: #a33; stroke-width: 1; stroke-dasharray: 4 2; }
.axisline { stroke: #999; }
.lv0 { background: var(--l0); } .lv1 { background: var(--l1); } .lv2 { background: var(--l2); color: #fff; } .lv3 { background: var(--l3); color: #fff; }
.stack { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--soft); }
.stack > div { height: 100%; font-size: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; }
.d-up { color: var(--up); font-weight: 600; } .d-down { color: var(--down); font-weight: 600; }
.badge { display: inline-block; font-size: 10px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); color: var(--mute); background: var(--soft); white-space: nowrap; }
.badge.cited { border-color: #c9b6e4; color: #5a3d8a; background: #f3eefb; }
.badge.draft { border-color: #7b5ea7; color: #fff; background: #7b5ea7; }
.badge.ruled { border-color: #ccc; }
.badge.weak { border-color: #e0b0b0; color: #933; background: #fbefef; }
.verdict { font-size: 12px; padding: 1px 6px; border-radius: 4px; }
.v-keeps { background: #e7f3e7; color: #2c6b2c; } .v-loses { background: repeating-linear-gradient(45deg, #fdf0d8, #fdf0d8 4px, #f7deb0 4px, #f7deb0 8px); color: #7a4b00; }
.v-falls { background: #fbe3e3; color: #8a1f1f; } .v-could { background: #e8eefb; color: #2a4a8a; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 13px; }
th { font-weight: 600; color: var(--mute); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.lvdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: middle; margin-right: 3px; }
.toast { position: fixed; top: 14px; right: 14px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
.toast.on { opacity: 1; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; z-index: 25; }
.modal.on { display: flex; }
.modal .panel { width: min(760px, 92vw); max-height: 85vh; overflow: auto; }
.modal pre { background: var(--soft); padding: 10px; border-radius: 6px; white-space: pre-wrap; font-size: 12px; }

/* floating prototype switcher */
#switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
  background: #111; color: #fff; border-radius: 999px; padding: 6px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.3); z-index: 40; font-size: 13px; }
#switcher button { background: transparent; color: #fff; border: none; font-size: 16px; padding: 0 6px; }
#switcher .tag { opacity: .6; font-size: 11px; margin-left: 4px; }

/* A: bench */
.A-shell { display: grid; grid-template-columns: 210px 1fr; gap: 16px; padding: 16px 18px 90px; }
.A-strip .m { padding: 7px 9px; border-radius: 8px; cursor: pointer; margin-bottom: 3px; border: 1px solid transparent; }
.A-strip .m:hover { background: var(--soft); } .A-strip .m.on { background: var(--panel); border-color: var(--line); }
.A-strip .m .r { font-size: 11px; color: var(--mute); }
.A-strip .m .mod { color: var(--up); font-weight: 600; }
.A-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.A-grid .panel { padding: 10px 12px; }
.A-grid .panel.draftp { border-color: #c9b6e4; background: #fcfaff; }
.A-grid .row { display: flex; justify-content: space-between; font-size: 12px; margin-top: 5px; }
.A-cuts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 800px) { .A-shell { grid-template-columns: 1fr; } .A-cuts { grid-template-columns: 1fr; } }

/* B: ledger */
.B-shell { padding: 0 18px 90px; max-width: 1100px; margin: 0 auto; }
.B-tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 12px 0 0; }
.B-tabs .t { padding: 7px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13px; }
.B-tabs .t.on { border-color: var(--ink); font-weight: 600; } .B-tabs .t .r { font-size: 11px; color: var(--mute); }
.B-tabs .t .mod { color: var(--up); }
.B-chart { display: grid; grid-template-columns: 1fr 260px; gap: 14px; align-items: center; margin: 12px 0; }
.B-ledger tr.typ { cursor: pointer; } .B-ledger tr.typ:hover td { background: #fafaf7; }
.B-ledger tr.via td { color: var(--mute); }
.B-ledger tr.exp td { background: #fafaf7; padding: 10px 14px 14px; }
.B-cell { white-space: nowrap; }
.B-ledger .bar0 { display: inline-block; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

/* C: cut-off first */
.C-shell { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; padding: 16px 18px 90px; }
.C-measures { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.C-measures .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.C-cut { display: grid; grid-template-columns: 1fr 34px 1fr; gap: 0; align-items: stretch; margin-top: 8px; }
.C-cut .side { display: flex; flex-direction: column; gap: 3px; }
.C-cut .side.l { align-items: flex-end; } .C-cut .wall { display: flex; justify-content: center; }
.C-cut .wall div { width: 2px; background: #a33; border-radius: 1px; }
.C-pill { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; background: var(--panel); max-width: 100%; }
.C-pill .lvdot { margin-right: 4px; }
.C-flow .f { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.C-big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.C-kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.C-kpis .panel { padding: 10px; }
@media (max-width: 900px) { .C-shell { grid-template-columns: 1fr; } }
</style>
<script src="status.js"></script>
<script src="data.js"></script>
<script src="replay.js"></script>
</head>
<body>
<div id="banner"></div>
<header class="top">
  <h1>Stake calibration</h1>
  <span class="mute" id="built"></span>
  <span class="spacer"></span>
  <span id="campaigns"></span>
  <details class="toggle"><summary>clamp</summary><label><input type="checkbox" id="clamp" checked> scale clamped to −20…+15</label></details>
  <button id="reset">reset all</button>
  <button class="primary" id="copy">Copy snippet + readout</button>
</header>
<main id="app"></main>
<div id="switcher"><button id="prev" title="previous variant (←)">‹</button><span id="vlabel"></span><button id="next" title="next variant (→)">›</button><span class="tag">prototype</span></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="panel"><h3>Copied to the clipboard</h3><pre id="snippet"></pre><button id="closeModal">close</button></div></div>

<script>
(function () {
const D = window.CALIB, R = window.Replay, ST = window.CALIB_STATUS || {};
const rows = D.rows, drafts = D.drafts;
const LEVELS = ["trivial", "minor", "major", "campaign-defining"];
const SHORT = ["T", "m", "M", "CD"];
const VARIANTS = [["A", "Bench"], ["B", "Ledger"], ["C", "Cut-offs first"]];
const MEASURE_LABEL = {
  power: "nation power", population: "population", organization: "organization tier²", hab: "hab tier²", fleet: "ship mass",
  battle: "contested mass", faction: "faction weight", nuclear: "warheads moved", boost: "boost (draft)", mission_control: "mission control (draft)",
};
const DRAFT_MEASURES = new Set(["boost", "mission_control"]);
const MEASURES = Object.keys(R.CODE_REFS).filter((m) => DRAFT_MEASURES.has(m) || rows.some((r) => r.m === m));
const baseLevel = rows.map((r) => R.levelOf(r.p));
const fixed = null;
const fmt = (x, d = 3) => (x === undefined || x === null ? "–" : Number(Number(x).toPrecision(d)).toString());
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const typeLabel = (t) => t.replace(/_/g, " ").replace(".", " · ");

// ---------------- state: ?variant= in the search, the calibration in the hash ----------------
const params = new URLSearchParams(location.search);
let variant = params.get("variant") || "A";
const state = { m: "power", refs: { ...R.CODE_REFS }, clamp: true, camps: D.campaigns.map(() => true), dbase: { held: 62, moved: 62 }, open: null };
(function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("m") && MEASURES.includes(h.get("m"))) state.m = h.get("m");
  for (const m of MEASURES) if (h.get("r." + m)) state.refs[m] = Number(h.get("r." + m));
  if (h.get("clamp") === "0") state.clamp = false;
  if (h.get("c")) state.camps = D.campaigns.map((_, i) => h.get("c")[i] !== "0");
  for (const k of Object.keys(state.dbase)) if (h.get("b." + k)) state.dbase[k] = Number(h.get("b." + k));
})();
function writeHash() {
  const h = new URLSearchParams();
  h.set("m", state.m);
  for (const m of MEASURES) if (state.refs[m] !== R.CODE_REFS[m]) h.set("r." + m, fmt(state.refs[m], 4));
  if (!state.clamp) h.set("clamp", "0");
  if (state.camps.some((x) => !x)) h.set("c", state.camps.map((x) => (x ? 1 : 0)).join(""));
  for (const k of Object.keys(state.dbase)) if (state.dbase[k] !== 62) h.set("b." + k, state.dbase[k]);
  history.replaceState(null, "", location.pathname + location.search + "#" + h.toString());
}

// ---------------- model ----------------
const opts = { clamp: true };
function compute() {
  opts.clamp = state.clamp;
  const real = R.replay(rows, state.refs, opts);
  const on = (r) => state.camps[r.c];
  const lvl = (i) => R.levelOf(real.score[i]);
  const m = state.m, ref = state.refs[m];
  // distribution
  const shares = [], dshares = [];
  rows.forEach((r) => { if (r.m === m && on(r)) shares.push(r.sh); });
  drafts.forEach((d) => { if (on(d) && d.cand[m]) dshares.push(d.cand[m]); });
  const all = shares.concat(dshares);
  const lo = all.length ? Math.floor(Math.log10(Math.min(...all)) - 0.2) : -5;
  // types on this measure
  const types = new Map();
  rows.forEach((r, i) => {
    if (r.m !== m || !on(r)) return;
    let t = types.get(r.t);
    if (!t) types.set(r.t, (t = { t: r.t, now: [0, 0, 0, 0], was: [0, 0, 0, 0], n: 0, ruled: 0, cited: 0, rows: [], fell: 0 }));
    t.n++; t.now[lvl(i)]++; t.was[baseLevel[i]]++; t.rows.push(i);
    if (r.ruled) t.ruled++;
    if (real.decided[i] !== i) t.cited++;
  });
  // types moved through a cited event of this measure
  const via = new Map();
  rows.forEach((r, i) => {
    if (r.m === m || !on(r)) return;
    const d = real.decided[i];
    if (d === i || rows[d].m !== m || lvl(i) === baseLevel[i]) return;
    let t = via.get(r.t);
    if (!t) via.set(r.t, (t = { t: r.t, moved: 0, up: 0, down: 0, own: r.m || null }));
    t.moved++; lvl(i) > baseLevel[i] ? t.up++ : t.down++;
  });
  // members (takeover waves): the member gate admits takeovers below campaign-defining
  const waves = [], could = [];
  if (m === "power") {
    rows.forEach((r, i) => {
      if (!r.wave || !on(r)) return;
      const members = (r.ci || []).filter((j) => rows[j].t === "faction.takeover");
      const kept = members.filter((j) => lvl(j) < 3);
      const nations = new Set(kept.flatMap((j) => rows[j].tg || []));
      const verdict = kept.length === members.length ? "keeps" : nations.size >= 3 ? "loses" : "falls";
      waves.push({ i, verdict, members: members.length, kept: kept.length, nations: nations.size });
    });
    rows.forEach((r, i) => {
      if (r.t === "faction.takeover" && on(r) && r.mo === undefined && baseLevel[i] === 3 && lvl(i) < 3) could.push(i);
    });
    const w = types.get("faction.takeover_wave");
    if (w) for (const x of waves) if (x.verdict === "falls") { w.now[lvl(x.i)]--; w.fell++; }
  }
  // cut-offs: where a base level's score crosses a band edge
  const bases = new Set(); rows.forEach((r) => { if (r.m === m && on(r)) bases.add(r.b); });
  drafts.forEach((d) => { if (on(d) && d.cand[m]) bases.add(state.dbase[d.draft]); });
  const cutmap = new Map();
  for (const b of bases) for (const edge of [25, 50, 75]) {
    const k = edge - b; // the scale that reaches the edge
    if (state.clamp && (k <= R.SCALE_MIN || k > R.SCALE_MAX)) continue;
    const db = k - 0.5; // raw scale where rounding first reaches k
    if (!cutmap.has(db)) cutmap.set(db, { db, x: ref * 10 ** (db / 10), bases: [] });
    cutmap.get(db).bases.push({ b, edge });
  }
  let cuts = [...cutmap.values()].sort((a, b) => a.db - b.db);
  cuts.forEach((c) => {
    const bs = new Set(c.bases.map((x) => x.b));
    const near = [];
    rows.forEach((r, i) => { if (r.m === m && on(r) && bs.has(r.b)) near.push({ i, dist: Math.log10(r.sh / c.x) }); });
    drafts.forEach((d, j) => { if (on(d) && d.cand[m] && bs.has(state.dbase[d.draft])) near.push({ draft: j, dist: Math.log10(d.cand[m] / c.x) }); });
    c.below = near.filter((e) => e.dist < 0).sort((a, b) => b.dist - a.dist).slice(0, 5);
    c.above = near.filter((e) => e.dist >= 0).sort((a, b) => a.dist - b.dist).slice(0, 5);
    c.count = near.length;
  });
  if (!state.clamp) cuts = cuts.filter((c) => c.count && (Math.abs(c.below[0]?.dist ?? 9) < 1.5 || Math.abs(c.above[0]?.dist ?? 9) < 1.5));
  // drafts on this measure
  const dp = [];
  for (const [id, info] of Object.entries(D.draftInfo)) {
    const mine = drafts.map((d, j) => [d, j]).filter(([d]) => d.draft === id && on(d) && d.cand[m]);
    if (!mine.length) continue;
    const now = [0, 0, 0, 0], realNow = [0, 0, 0, 0]; let floored = 0, ruled = 0;
    const res = mine.map(([d, j]) => {
      const x = R.replayDraft(d, rows, real, state.refs, d.ruled ? d.kb : state.dbase[id], state.clamp);
      now[R.levelOf(x.score)]++; if (x.floored) floored++;
      return { j, ...x };
    });
    const realType = rows.map((r, i) => [r, i]).filter(([r]) => r.t === mine[0][0].t && on(r) && r.s === "n");
    realType.forEach(([, i]) => realNow[lvl(i)]++);
    dp.push({ id, ...info, t: mine[0][0].t, n: mine.length, now, realNow, floored, ruled, res, measures: [...new Set(mine.flatMap(([d]) => Object.keys(d.cand)))] });
  }
  // downstream: the narrator's default package (narrative events at major or above)
  let pkgNow = 0, pkgWas = 0, narr = 0;
  rows.forEach((r, i) => { if (r.s === "n" && on(r)) { narr++; if (lvl(i) >= 2) pkgNow++; if (baseLevel[i] >= 2) pkgWas++; } });
  // strip: every measure's reference and how many events it moves now
  const strip = MEASURES.map((mm) => {
    let n = 0, moved = 0;
    rows.forEach((r, i) => { if (r.m === mm && on(r)) { n++; if (lvl(i) !== baseLevel[i]) moved++; } });
    const dn = drafts.filter((d) => on(d) && d.cand[mm]).length;
    return { m: mm, ref: state.refs[mm], code: R.CODE_REFS[mm], n, dn, moved, mod: state.refs[mm] !== R.CODE_REFS[mm] };
  });
  return { real, lvl, m, ref, shares, dshares, lo, types: [...types.values()].sort((a, b) => b.n - a.n), via: [...via.values()], waves, could, cuts, dp, pkg: { now: pkgNow, was: pkgWas, narr }, strip };
}

// ---------------- shared pieces ----------------
function chart(M, { w = 640, h = 170, cuts = true } = {}) {
  const LO = M.lo, HI = 0, top = 14, base = h - 40;
  const X = (lg) => ((Math.max(LO, Math.min(HI, lg)) - LO) / (HI - LO)) * w;
  const bins = (HI - LO) * 10, bw = w / bins;
  const B = Array.from({ length: bins }, () => ({ low: 0, in: 0, high: 0, d: 0 }));
  const cls = (s) => { const k = R.scale(s, M.ref, false); return k <= -13 ? "low" : k >= 13 ? "high" : "in"; };
  M.shares.forEach((s) => { B[Math.max(0, Math.min(bins - 1, Math.floor((Math.log10(s) - LO) * 10)))][cls(s)]++; });
  M.dshares.forEach((s) => { B[Math.max(0, Math.min(bins - 1, Math.floor((Math.log10(s) - LO) * 10)))].d++; });
  const peak = Math.max(1, ...B.map((b) => Math.max(b.low + b.in + b.high, b.d)));
  const lr = Math.log10(M.ref), lc = Math.log10(R.CODE_REFS[M.m]);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="share distribution">`;
  s += `<rect class="win" x="${X(lr - 1.25)}" y="${top - 6}" width="${X(lr + 1.25) - X(lr - 1.25)}" height="${base - top + 6}"/>`;
  B.forEach((b, i) => {
    let y = base;
    for (const c of ["in", "low", "high"]) { if (!b[c]) continue; const hh = (b[c] / peak) * (base - top); y -= hh; s += `<rect class="bar ${c}" x="${i * bw + .5}" y="${y}" width="${bw - 1}" height="${hh}"/>`; }
    if (b.d) { const hh = (b.d / peak) * (base - top); s += `<rect class="bar draft" x="${i * bw + 1}" y="${base - hh}" width="${bw - 2}" height="${hh}"/>`; }
  });
  if (cuts) M.cuts.forEach((c) => { const lx = Math.log10(c.x); if (lx > LO && lx < HI) s += `<line class="cutline" x1="${X(lx)}" x2="${X(lx)}" y1="${top - 8}" y2="${base}"/>`; });
  s += `<line class="codeline" x1="${X(lc)}" x2="${X(lc)}" y1="${top - 8}" y2="${base}"/>`;
  s += `<line class="refline" x1="${X(lr)}" x2="${X(lr)}" y1="${top - 8}" y2="${base}"/>`;
  s += `<line class="axisline" x1="0" x2="${w}" y1="${base}" y2="${base}"/>`;
  for (let d = LO; d <= HI; d++) s += `<text x="${Math.min(w - 2, Math.max(2, X(d)))}" y="${base + 14}" text-anchor="${d === LO ? "start" : d === HI ? "end" : "middle"}">${d === 0 ? "1" : "1e" + d}</text>`;
  s += `<text x="${X(lr)}" y="${base + 28}" text-anchor="middle" style="fill:var(--ink)">ref ${fmt(M.ref)}</text>`;

  return s + "</svg>";
}
function refControl(M) {

function stack(counts) {

}
function delta(now, was) { const d = now - was; return d === 0 ? "" : `<span class="${d > 0 ? "d-up" : "d-down"}">${d > 0 ? "+" : "−"}${Math.abs(d)}</span>`; }
function eventLine(M, e, { compact = false } = {}) {

// ---------------- snippet + readout ----------------
function snippet() {
  const M = compute();
  const changed = MEASURES.filter((m) => state.refs[m] !== R.CODE_REFS[m]);
  const camps = D.campaigns.filter((_, i) => state.camps[i]).join(", ");
  const code = changed.length ? changed.map((m) => `    StakeMeasure.${m.toUpperCase()}: ${fmt(state.refs[m], 4)},  # was ${fmt(R.CODE_REFS[m])}`).join("\n") : "    # no reference changed";
  const moves = [];
  rows.forEach((r, i) => { if (state.camps[r.c] && M.lvl(i) !== baseLevel[i]) moves.push(r.t + " " + LEVELS[baseLevel[i]] + "→" + LEVELS[M.lvl(i)]); });
  const counts = {}; moves.forEach((x) => (counts[x] = (counts[x] || 0) + 1));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, n]) => `${k} ×${n}`).join("; ");
  const readout = `${changed.length ? changed.map((m) => `${m} reference ${fmt(R.CODE_REFS[m])} → ${fmt(state.refs[m], 4)} (window ${fmt(state.refs[m] / 17.8)} … ${fmt(state.refs[m] * 17.8)})`).join("; ") : "References unchanged"}, on ${camps} at commit ${D.commit}${state.clamp ? "" : ", clamp off"}. ${moves.length} events change level${top ? ": " + top : ""}. Narrator package (narrative ≥ major): ${M.pkg.was} → ${M.pkg.now}.${M.waves.length ? ` Takeover waves: ${M.waves.filter((w) => w.verdict === "loses").length} lose members, ${M.waves.filter((w) => w.verdict === "falls").length} fall apart.` : ""}`;
  return `# narrative/measures.py\n${code}\n\n${readout}\n\n${location.href}`;
}

// ---------------- render + events ----------------
// minimal DOM morph so the slider being dragged survives a re-render
function morph(live, next) {
  if (live.nodeType !== next.nodeType || live.nodeName !== next.nodeName) { live.replaceWith(next); return; }
  if (live.nodeType === 3) { if (live.data !== next.data) live.data = next.data; return; }
  if (live.nodeType !== 1) return;
  if (live === document.activeElement && live.tagName === "INPUT") return;
  for (const a of [...live.attributes]) if (!next.hasAttribute(a.name)) live.removeAttribute(a.name);
  for (const a of [...next.attributes]) if (live.getAttribute(a.name) !== a.value) live.setAttribute(a.name, a.value);
  if (live.tagName === "INPUT" || live.tagName === "SELECT") { if (live.value !== next.value && next.getAttribute("value") !== null) live.value = next.getAttribute("value"); }
  if (live.tagName === "SELECT") { const s = next.querySelector("option[selected]"); if (s) live.value = s.value; }
  const lc = [...live.childNodes], nc = [...next.childNodes];
  nc.forEach((n, i) => (lc[i] ? morph(lc[i], n) : live.appendChild(n)));
  for (let i = nc.length; i < lc.length; i++) lc[i].remove();
}
function render() {
  const M = compute();
  const app = document.getElementById("app");
  const tpl = document.createElement("main");
  tpl.innerHTML = (variant === "B" ? viewB : variant === "C" ? viewC : viewA)(M);
  if (app.firstElementChild && app.dataset.v === variant) morph(app.firstElementChild, tpl.firstElementChild);
  else { app.innerHTML = ""; app.appendChild(tpl.firstElementChild); app.dataset.v = variant; }
  const v = VARIANTS.find((x) => x[0] === variant);
  document.getElementById("vlabel").textContent = `${v[0]} (${v[1]})`;
  document.getElementById("campaigns").innerHTML = D.campaigns.map((c, i) => `<span class="chip ${state.camps[i] ? "" : "off"}" data-act="camp" data-i="${i}">${esc(c)}</span>`).join(" ");
  document.getElementById("clamp").checked = state.clamp;
  writeHash();
}
document.getElementById("banner").innerHTML = ST.stale || params.get("stale")
  ? `<div class="banner">⚠ This page's data was built from <code>${esc(ST.built_from || D.commit)}</code>, and <code>src/</code> or the samples have changed since. Run <code>tinarrative benchmark calibrate</code> to refresh.</div>` : "";
document.getElementById("built").textContent = `data from ${D.commit} · ${rows.length} events · ${rows.filter((r) => r.m).length} with a stake`;

let frame = 0;
const soon = () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(render); };
document.addEventListener("input", (e) => {
  const act = e.target.dataset.act;
  if (act === "ref") { state.refs[state.m] = Number((10 ** Number(e.target.value)).toPrecision(3)); soon(); }
  if (act === "refnum" && Number(e.target.value) > 0) { state.refs[state.m] = Number(e.target.value); soon(); }
  if (act === "dbase") { state.dbase[e.target.dataset.id] = Number(e.target.value); soon(); }
  if (e.target.id === "clamp") { state.clamp = e.target.checked; soon(); }
});
// keep the focused range input under the pointer while re-rendering: re-focus it
let lastRangeFocus = false;
const rerenderKeepFocus = () => { const wasRange = document.activeElement?.dataset?.act === "ref"; render(); if (wasRange) document.querySelector('[data-act="ref"]')?.focus(); };
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "focus") { state.m = el.dataset.m; state.open = null; render(); }
  if (act === "coderef") { state.refs[state.m] = R.CODE_REFS[state.m]; render(); }
  if (act === "camp") { state.camps[el.dataset.i] = !state.camps[el.dataset.i]; render(); }
  if (act === "open") { state.open = state.open === el.dataset.t ? null : el.dataset.t; render(); }
});
document.getElementById("reset").onclick = () => { state.refs = { ...R.CODE_REFS }; state.clamp = true; state.camps = D.campaigns.map(() => true); state.dbase = { held: 62, moved: 62 }; render(); };
document.getElementById("copy").onclick = async () => {
  const text = snippet();
  try { await navigator.clipboard.writeText(text); } catch (_) {}
  document.getElementById("snippet").textContent = text;
  document.getElementById("modal").classList.add("on");
};
document.getElementById("closeModal").onclick = () => document.getElementById("modal").classList.remove("on");

// prototype switcher
function go(dir) {
  const i = VARIANTS.findIndex((x) => x[0] === variant);
  variant = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length][0];
  params.set("variant", variant);
  history.replaceState(null, "", location.pathname + "?" + params.toString() + location.hash);
  render();
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
render();
})();
</script>
