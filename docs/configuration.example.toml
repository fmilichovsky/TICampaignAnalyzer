# Copy this file and keep only the settings you change.

[events] # events --narrative, narrate and councilors
# Larger gaps combine changes into longer episodes; smaller gaps split them sooner.
episode_gap_days = 365
# Larger lists show more nations in rankings and economy summaries (1-20).
top_nations = 10
# Maximum earlier narrative events recalled by each chapter.
recalled_narrative_events = 40
# How far space counts in a faction's weight once humans hold a large presence there (0-1). Higher ranks space
# events of a faction more by its space holdings; lower ranks them by its hold on Earth.
w_space = 0.5

[llm] # narrate and --send for narrate and councilors
# Larger inputs allow larger chapters; smaller values split them sooner. 200000-300000 suits most campaigns,
# even with a larger context window: bigger chapters save little input, run one after another and come back
# shorter, quoting the package. A value below the largest period's request splits that period or leaves out its
# atomic stream.
max_input_tokens = 200000
# Larger estimates allow larger chapters; smaller values budget more cautiously.
chars_per_token = 2.4
# Larger outputs allow longer chapters; smaller values split them sooner. A chapter's length may take half;
# raise it for models that reason at length.
max_output_tokens = 16000
# Longer timeouts allow slower providers to finish; shorter ones fail sooner.
timeout_seconds = 600
# Choose the API used to send requests.
# provider = "openai"
# Set the model ID sent with each request.
# model = "..."
# Point requests at a compatible API endpoint.
# base_url = "https://..."
# Name the environment variable that holds the API key.
# api_key_env = "OPENAI_API_KEY"
# State the provider model's context limit to reject oversized requests.
# context_window = 200000
# Set the sampling randomness; unset leaves the provider default.
# temperature = 0.7
# Limit request attempts per minute; higher values allow more requests.
# requests_per_minute = 30
# Limit reserved tokens per minute; higher values allow more throughput.
# tokens_per_minute = 100000

[llm.profiles]
# [llm.profiles.local]
# provider = "ollama"
# model = "..."
# max_input_tokens = 24000

[councilors] # councilors dossier selection and article requests
# More rivals adds more councilors from other factions.
rivals_per_faction = 2
# A longer tenure cut selects fewer councilors.
min_tenure_days = 365
# Longer articles ask the model for more detail.
article_words = 300

[processing] # save processing commands
# More workers can shorten runs while using more memory.
# jobs = 4
