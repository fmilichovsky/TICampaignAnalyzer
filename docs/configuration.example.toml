# tinarrative settings: every key at its built-in default (docs/configuration.md).
# Copy this file, keep only the keys you change, and pass it with
# `tinarrative events --narrative --config <file>` (or narrate) or TINARRATIVE_CONFIG.
# All windows and spans are in game days.

[narrative.geopolitics]
# A faction.takeover is campaign_defining when its nation ranks this high or
# higher by GDP in the report after the takeover's first interval (minimum 1).
top_gdp_nations = 10

# Control changes of one nation to the same faction this soon after the first
# join one takeover; its control-point gains are attached over the same window.
takeover_consolidation_days = 180

# The faction's unrest attempts and the nation's unrest and opinion shifts this
# long before a takeover are attached as precursors.
takeover_precursor_days = 90

# A Coup, Purge or Crackdown charge is attached to a takeover when dated this
# long before it at most (the assignment-to-outcome bound, architecture 11.3).
ledger_window_days = 28

# Gains of one nation chain into one nation.expansion while each follows the
# previous one this soon.
expansion_gap_days = 365

# A released or breakaway nation's own events this soon after its independence
# are attached.
release_window_days = 180

# Statistic shifts of one nation this soon after the first form one
# nation.transformation.
transformation_window_days = 120

[narrative.space]

# Battle outcomes of one killer and victim pair chain into one
# faction.space_campaign while each follows the previous one this soon.
campaign_gap_days = 365

# First habs on new bodies of one faction this soon after the first form one
# faction.colonisation_wave.
colonisation_window_days = 180

# A faction.fleet_buildup needs at least this many ships of one hull appearing
# for one faction in one interval.
buildup_min_ships = 5

[narrator]
# The budget of tinarrative narrate; it never changes what events builds. 
# One request's estimated input, system prompt, request block
# and chapter package together, stays within this many tokens (minimum 1000).
max_input_tokens = 200000

# The estimate divides the request's characters by this (minimum 1)
# to calculate the expected token count; a lower value is more conservative.
chars_per_token = 3

# A campaign spanning this many game days or fewer is told by quarter.
quarter_span_days = 730

# A longer campaign spanning this many game days or fewer is told by half
# year; a longer one by year.
half_span_days = 1825

# Each chapter is reminded of at most this many developments of earlier
# chapters (major and above; the most significant, then the most recent, are
# kept and the rest counted), so the model can refer back to them without
# retelling them. 0 turns the reminder off; a larger value costs input tokens
# in every later chapter.
recalled_developments = 40

# A chapter's situation reports keep the nations the chapter references and
# this many more, the largest by GDP.
top_economies = 10
