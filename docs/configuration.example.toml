# tinarrative settings: every key at its built-in default (docs/configuration.md).
# Copy this file, keep only the keys you change, and pass it with
# `tinarrative events --narrative --config <file>` (or narrate) or TINARRATIVE_CONFIG.
# All windows and spans are in game days.

[narrative.geopolitics]
# A faction.takeover is campaign_defining when its nation ranks this high or
# higher by GDP in the report after the takeover's first interval (minimum 1).
top_gdp_nations = 10

# Control changes of one nation to the same faction this soon after the first
# join one takeover; its control-point gains are attached over the same window.
takeover_consolidation_days = 180

# The faction's unrest attempts and the nation's unrest and opinion shifts this
# long before a takeover are attached as precursors.
takeover_precursor_days = 90

# A Coup, Purge or Crackdown charge is attached to a takeover when dated this
# long before it at most (the assignment-to-outcome bound, architecture 11.3).
ledger_window_days = 28

# Gains of one nation chain into one nation.expansion while each follows the
# previous one this soon.
expansion_gap_days = 365

# A released or breakaway nation's own events this soon after its independence
# are attached.
release_window_days = 180

# A development keeps at most this many metric_shifts entries: its role
# nations' first, then nuclear weapons, then the largest relative change; the
# rest are counted as metric_shifts_omitted (minimum 0).
metric_shifts_max = 12

[narrative.space]

# Battle outcomes of one killer and victim pair chain into one
# faction.space_campaign while each follows the previous one this soon.
campaign_gap_days = 365

# First habs on new bodies of one faction this soon after the first form one
# faction.colonisation_wave.
colonisation_window_days = 180

# A faction.fleet_buildup needs at least this many ships of one hull appearing
# for one faction in one interval.
buildup_min_ships = 5

[narrative.nation_metrics]
# A band crossing must still hold in the next situation report when that
# report is dated this soon after it to become a nation.*_shift; a later
# report cannot refute it.
band_hold_days = 180
# A nation.military_buildup or nation.demobilization needs a nation's
# standard armies to move by at least this many.
buildup_min_armies = 2
# Boost or mission control growth of one nation this soon after the previous
# chains into one nation.space_program_growth.
space_assets_window_days = 365
# Nuclear arsenal shifts of one nation this soon after the previous chain into
# one nation.nuclear_armament, nuclear_buildup or nuclear_disarmament.
nuclear_window_days = 365
# A nation.nuclear_buildup gains at least this many weapons, or half the
# arsenal it started from.
nuclear_buildup_min = 5
# world.ranking_changed reports changes of the top this many nations by GDP,
# strength, boost and mission control (at most 20); situation reports list
# this many spaceports.
ranking_top_n = 10

[narrator]
# The budget of tinarrative narrate; it never changes what events builds. 
# One request's estimated input, system prompt, request block
# and chapter package together, stays within this many tokens (minimum 1000).
max_input_tokens = 200000

# The estimate divides the request's characters by this (minimum 1)
# to calculate the expected token count; a lower value is more conservative.
chars_per_token = 3

# A campaign spanning this many game days or fewer is told by quarter.
quarter_span_days = 730

# A longer campaign spanning this many game days or fewer is told by half
# year; a longer one by year.
half_span_days = 1825

# Each chapter is reminded of at most this many developments of earlier
# chapters (major and above; the most significant, then the most recent, are
# kept and the rest counted), so the model can refer back to them without
# retelling them. 0 turns the reminder off; a larger value costs input tokens
# in every later chapter.
recalled_developments = 40

# A chapter's situation reports keep the nations the chapter references and
# this many more, the largest by GDP.
top_economies = 10

# The provider of tinarrative narrate --send. There is no default provider or
# model; set them here, in a profile or with --provider and --model.
# provider = "anthropic"            # anthropic, openai or ollama
# model = "..."                     # the model ID the provider names
# base_url = "https://..."          # unset: the provider's public API (ollama: http://localhost:11434)
# api_key_env = "ANTHROPIC_API_KEY" # the NAME of the variable holding the key, never the key

# One request's completion stops at this many tokens (minimum 1); a
# completion that reaches it fails its chapter.
max_output_tokens = 16000

# The model's context window, when stated: max_input_tokens plus
# max_output_tokens above it is rejected before sending (minimum 1).
# context_window = 200000

# The sampling temperature sent with each request; unset sends none. Current
# Claude models reject it.
# temperature = 0.7

# One HTTP request is abandoned after this many seconds (minimum 1).
timeout_seconds = 600

# Named profiles, chosen with --profile NAME. A profile sets provider, model,
# base_url, api_key_env, max_input_tokens, max_output_tokens, chars_per_token,
# context_window, temperature or timeout_seconds over the keys above; flags
# override both.
[narrator.profiles]

# [narrator.profiles.claude]
# provider = "anthropic"
# model = "claude-sonnet-5-5"
# api_key_env = "ANTHROPIC_API_KEY"

# [narrator.profiles.local]
# provider = "ollama"
# model = "..."
# max_input_tokens = 24000
# max_output_tokens = 4000
# context_window = 32768
# timeout_seconds = 1800
